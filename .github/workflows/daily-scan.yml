name: Doffin weekly scan

on:
  schedule:
    # Fredag 15:00 Europe/Oslo. Oslo er UTC+1 (vinter) / UTC+2 (sommer) — 13:00 UTC
    # gir 15:00 sommertid (CEST) og 14:00 vintertid (CET). Juster til "0 14 * * 5"
    # når Norge går over til vintertid i slutten av oktober, om du vil ha eksakt
    # klokketid. Ukedagen (5 = fredag) MÅ holdes i sync med WEEKLY_DIGEST_DAY-
    # variabelen deliver.py leser (default 5) — se README.
    - cron: "0 13 * * 5"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send digest nå (for testing manuelle kjøringer utenom fredag)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch new Doffin notices (siste 7 dager)
        env:
          DOFFIN_SUBSCRIPTION_KEY: ${{ secrets.DOFFIN_SUBSCRIPTION_KEY }}
        run: python -m src.fetch_doffin --since-hours 168

      - name: Fetch new TED notices (siste 7 dager, EU-wide, no key needed)
        run: python -m src.fetch_ted --since-days 7

      - name: Score notices
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.score_notices

      - name: Deliver digest
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          DIGEST_THRESHOLD: ${{ vars.DIGEST_THRESHOLD }}
          WEEKLY_DIGEST_DAY: ${{ vars.WEEKLY_DIGEST_DAY }}
        run: python -m src.deliver ${{ (inputs.force_send && '--force-send') || '' }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_notices.json data/weekly_accumulator.json
          git diff --staged --quiet || git commit -m "Update seen_notices.json / weekly_accumulator.json [skip ci]"
          git push
